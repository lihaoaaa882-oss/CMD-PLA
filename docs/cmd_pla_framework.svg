<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <title>CMD-PLA model framework</title>
  <desc>White-background model framework diagram for CMD-PLA.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.outer{fill:#fff;stroke:#153d73;stroke-width:2}.panel{fill:#fff;stroke:#153d73;stroke-width:2}.cmd{fill:#dbe4f3;stroke:#153d73;stroke-width:2}.sub{fill:#f7f7f7;stroke:#153d73;stroke-width:2}.txt{font-family:'Times New Roman',serif;fill:#000}.title{font-size:30px;font-weight:700}.label{font-size:22px}.small{font-size:17px}.tiny{font-size:13px}.atomB{fill:#a8c0e8;stroke:#173963;stroke-width:2}.atomO{fill:#ed7d31;stroke:#8d3f0d;stroke-width:2}.bond{stroke:#111;stroke-width:2}.dash{stroke:#333;stroke-width:1.5;stroke-dasharray:5 4}.arrow{stroke:#b8cbe7;stroke-width:11;fill:none;marker-end:url(#arrow)}.thin{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow2)}.bluebar{fill:#5b9bd5;stroke:#fff;stroke-width:4}.green{fill:#c6efce;stroke:#153d73;stroke-width:2}.cyan{fill:#b7f0f2;stroke:#153d73;stroke-width:2}.cream{fill:#fff2cc;stroke:#153d73;stroke-width:2}.pale{fill:#e2f0d9;stroke:#153d73;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b8cbe7"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
  </defs>
  <rect width="1600" height="960" class="bg"/>

  <g id="raw-complex" transform="translate(70 115)">
    <circle cx="55" cy="90" r="8" class="atomB"/><circle cx="85" cy="64" r="8" class="atomB"/><circle cx="126" cy="80" r="8" class="atomB"/><circle cx="103" cy="116" r="8" class="atomO"/><circle cx="70" cy="134" r="8" class="atomO"/><circle cx="145" cy="129" r="8" class="atomO"/><circle cx="175" cy="96" r="8" class="atomB"/><circle cx="198" cy="136" r="8" class="atomB"/><circle cx="130" cy="166" r="8" class="atomB"/><line x1="55" y1="90" x2="85" y2="64" class="bond"/><line x1="85" y1="64" x2="126" y2="80" class="bond"/><line x1="126" y1="80" x2="103" y2="116" class="bond"/><line x1="103" y1="116" x2="70" y2="134" class="bond"/><line x1="103" y1="116" x2="145" y2="129" class="bond"/><line x1="145" y1="129" x2="175" y2="96" class="bond"/><line x1="145" y1="129" x2="198" y2="136" class="bond"/>
    <text x="125" y="205" text-anchor="middle" class="txt small">Raw Complex</text>
  </g>
  <path d="M285 215 H350" class="arrow"/>

  <g id="cmd" transform="translate(370 55)">
    <rect x="0" y="0" width="690" height="300" class="cmd"/>
    <text x="345" y="38" text-anchor="middle" class="txt title">Conditional Molecular Dynamics Refinement</text>
    <rect x="35" y="68" width="180" height="190" class="sub"/><rect x="215" y="68" width="230" height="190" class="sub"/><rect x="445" y="68" width="210" height="190" class="sub"/>
    <text x="70" y="96" class="txt small">Input: X<tspan baseline-shift="sub" font-size="12">L</tspan>, X<tspan baseline-shift="sub" font-size="12">P</tspan></text>
    <ellipse cx="125" cy="165" rx="70" ry="45" fill="#c7d9ef"/><circle cx="85" cy="160" r="7" class="atomB"/><circle cx="113" cy="140" r="7" class="atomO"/><circle cx="148" cy="158" r="7" class="atomB"/><circle cx="128" cy="190" r="7" class="atomO"/><circle cx="94" cy="200" r="7" class="atomB"/><line x1="85" y1="160" x2="113" y2="140" class="bond"/><line x1="113" y1="140" x2="148" y2="158" class="bond"/><line x1="113" y1="140" x2="128" y2="190" class="bond"/><line x1="94" y1="200" x2="128" y2="190" class="bond"/>
    <text x="245" y="105" class="txt tiny">L<tspan baseline-shift="sub" font-size="10">cmd</tspan> = E[...] - E[...]</text>
    <circle cx="275" cy="162" r="28" fill="#9bb9e5" opacity=".55"/><circle cx="330" cy="162" r="28" fill="#ed7d31" opacity=".55"/><path d="M305 162 H365" class="arrow" style="stroke-width:5"/><circle cx="395" cy="162" r="28" fill="#9bb9e5" opacity=".55"/><text x="278" y="225" class="txt small">t=0</text><text x="393" y="225" class="txt small">t=1</text>
    <text x="465" y="96" class="txt small">Output:</text><circle cx="505" cy="140" r="7" class="atomB"/><circle cx="540" cy="125" r="7" class="atomB"/><circle cx="570" cy="150" r="7" class="atomO"/><circle cx="600" cy="130" r="7" class="atomB"/><circle cx="625" cy="165" r="7" class="atomB"/><circle cx="595" cy="198" r="7" class="atomO"/><circle cx="550" cy="188" r="7" class="atomB"/><line x1="505" y1="140" x2="540" y2="125" class="bond"/><line x1="540" y1="125" x2="570" y2="150" class="bond"/><line x1="570" y1="150" x2="600" y2="130" class="bond"/><line x1="600" y1="130" x2="625" y2="165" class="bond"/><line x1="595" y1="198" x2="550" y2="188" class="bond"/><line x1="550" y1="188" x2="570" y2="150" class="bond"/><text x="562" y="235" text-anchor="middle" class="txt small">refinement complex</text>
  </g>

  <path d="M1060 205 H1140" class="arrow"/><text x="1176" y="214" text-anchor="middle" class="txt title">↻</text><path d="M1210 205 H1285" class="arrow"/>
  <path d="M1285 145 H1420" class="arrow"/><path d="M1285 270 H1420" class="arrow"/>
  <g transform="translate(1445 85)"><circle cx="20" cy="20" r="7" class="atomO"/><circle cx="50" cy="18" r="7" class="atomO"/><circle cx="75" cy="42" r="7" class="atomB"/><circle cx="105" cy="20" r="7" class="atomB"/><circle cx="42" cy="65" r="7" class="atomB"/><circle cx="90" cy="82" r="7" class="atomO"/><text x="65" y="120" text-anchor="middle" class="txt small">Intra graph</text></g>
  <g transform="translate(1445 235)"><circle cx="20" cy="20" r="7" class="atomO"/><circle cx="55" cy="36" r="7" class="atomO"/><circle cx="92" cy="18" r="7" class="atomB"/><circle cx="120" cy="46" r="7" class="atomB"/><circle cx="36" cy="75" r="7" class="atomO"/><circle cx="105" cy="86" r="7" class="atomB"/><line x1="20" y1="20" x2="92" y2="18" class="dash"/><line x1="55" y1="36" x2="120" y2="46" class="dash"/><line x1="36" y1="75" x2="105" y2="86" class="dash"/><text x="72" y="125" text-anchor="middle" class="txt small">Inter graph</text></g>

  <g id="left-inputs" transform="translate(65 360)">
    <g><circle cx="20" cy="30" r="7" class="atomO"/><circle cx="50" cy="18" r="7" class="atomO"/><circle cx="90" cy="38" r="7" class="atomB"/><circle cx="120" cy="22" r="7" class="atomB"/><circle cx="82" cy="78" r="7" class="atomO"/><circle cx="138" cy="95" r="7" class="atomO"/><line x1="20" y1="30" x2="50" y2="18" class="bond"/><line x1="50" y1="18" x2="90" y2="38" class="bond"/><line x1="82" y1="78" x2="138" y2="95" class="bond"/><text x="83" y="130" text-anchor="middle" class="txt small">Intra graph</text></g>
    <g transform="translate(0 165)"><circle cx="20" cy="30" r="7" class="atomO"/><circle cx="55" cy="20" r="7" class="atomB"/><circle cx="95" cy="44" r="7" class="atomB"/><circle cx="126" cy="22" r="7" class="atomB"/><circle cx="50" cy="85" r="7" class="atomO"/><circle cx="114" cy="94" r="7" class="atomB"/><line x1="20" y1="30" x2="95" y2="44" class="dash"/><line x1="50" y1="85" x2="114" y2="94" class="dash"/><text x="82" y="130" text-anchor="middle" class="txt small">Inter graph</text></g>
    <g transform="translate(0 340)"><circle cx="30" cy="20" r="7" class="atomB"/><circle cx="62" cy="44" r="7" class="atomB"/><circle cx="92" cy="20" r="7" class="atomB"/><circle cx="122" cy="48" r="7" class="atomB"/><line x1="30" y1="20" x2="62" y2="44" class="bond"/><line x1="62" y1="44" x2="92" y2="20" class="bond"/><line x1="92" y1="20" x2="122" y2="48" class="bond"/><text x="80" y="92" text-anchor="middle" class="txt small">Pocket</text></g>
    <g transform="translate(0 470)"><circle cx="25" cy="25" r="7" class="atomO"/><circle cx="58" cy="20" r="7" class="atomO"/><circle cx="88" cy="50" r="7" class="atomO"/><circle cx="120" cy="28" r="7" class="atomO"/><line x1="25" y1="25" x2="58" y2="20" class="bond"/><line x1="58" y1="20" x2="88" y2="50" class="bond"/><line x1="88" y1="50" x2="120" y2="28" class="bond"/><text x="75" y="92" text-anchor="middle" class="txt small">Ligand</text></g>
  </g>

  <g id="ldve" transform="translate(250 350)">
    <rect x="0" y="0" width="920" height="310" class="outer"/>
    <text x="460" y="28" text-anchor="middle" class="txt label">Local Dual View Encoder (LDVE)</text>
    <rect x="25" y="55" width="410" height="230" class="panel"/><rect x="470" y="55" width="420" height="230" class="panel"/>
    <text x="230" y="82" text-anchor="middle" class="txt small">Dual-View</text><text x="680" y="82" text-anchor="middle" class="txt small">RBF-Gated Aggregation</text>
    <rect x="45" y="105" width="180" height="70" class="panel"/><rect x="45" y="190" width="180" height="70" class="panel"/>
    <text x="82" y="148" class="txt label">Σ→</text><rect x="120" y="128" width="35" height="30" rx="5" class="green"/><text x="138" y="150" text-anchor="middle" class="txt small" font-style="italic">h</text>
    <text x="82" y="233" class="txt label">Σ→</text><rect x="120" y="213" width="35" height="30" rx="5" class="cyan"/><text x="138" y="235" text-anchor="middle" class="txt small" font-style="italic">h</text>
    <rect x="260" y="110" width="70" height="40" rx="7" class="green"/><text x="295" y="136" text-anchor="middle" class="txt small" font-style="italic">h<tspan baseline-shift="super" font-size="12">S</tspan><tspan baseline-shift="sub" font-size="12">intra</tspan></text>
    <rect x="260" y="158" width="70" height="40" rx="7" class="green"/><text x="295" y="184" text-anchor="middle" class="txt small" font-style="italic">x<tspan baseline-shift="super" font-size="12">S</tspan><tspan baseline-shift="sub" font-size="12">intra</tspan></text>
    <rect x="260" y="205" width="70" height="40" rx="7" class="cyan"/><text x="295" y="231" text-anchor="middle" class="txt small" font-style="italic">h<tspan baseline-shift="super" font-size="12">S</tspan><tspan baseline-shift="sub" font-size="12">inter</tspan></text>
    <rect x="340" y="134" width="62" height="34" rx="6" class="green"/><text x="371" y="157" text-anchor="middle" class="txt small" font-style="italic">ψ<tspan baseline-shift="sub" font-size="12">cov</tspan></text>
    <rect x="340" y="230" width="62" height="34" rx="6" class="cyan"/><text x="371" y="253" text-anchor="middle" class="txt small" font-style="italic">ψ<tspan baseline-shift="sub" font-size="12">ncov</tspan></text>
    <rect x="500" y="120" width="70" height="52" rx="7" class="cream"/><text x="535" y="150" text-anchor="middle" class="txt label" font-style="italic">d<tspan baseline-shift="sub" font-size="14">ij</tspan></text><rect x="598" y="126" width="80" height="36" rx="5" class="cream"/><text x="638" y="150" text-anchor="middle" class="txt label">RBF</text><rect x="706" y="112" width="74" height="60" rx="7" class="cream"/><text x="743" y="138" text-anchor="middle" class="txt small">gate</text><text x="743" y="162" text-anchor="middle" class="txt small" font-style="italic">W<tspan baseline-shift="sub" font-size="12">ij</tspan></text><rect x="828" y="126" width="55" height="36" rx="6" class="cream"/><text x="856" y="150" text-anchor="middle" class="txt small" font-style="italic">ψ<tspan baseline-shift="sub" font-size="12">intra</tspan></text>
    <rect x="500" y="210" width="70" height="52" rx="7" class="pale"/><text x="535" y="240" text-anchor="middle" class="txt label" font-style="italic">d<tspan baseline-shift="sub" font-size="14">ij</tspan></text><rect x="598" y="216" width="80" height="36" rx="5" class="pale"/><text x="638" y="240" text-anchor="middle" class="txt label">RBF</text><rect x="706" y="202" width="74" height="60" rx="7" class="pale"/><text x="743" y="228" text-anchor="middle" class="txt small">gate</text><text x="743" y="252" text-anchor="middle" class="txt small" font-style="italic">W<tspan baseline-shift="sub" font-size="12">ij</tspan></text><rect x="828" y="216" width="55" height="36" rx="6" class="pale"/><text x="856" y="240" text-anchor="middle" class="txt small" font-style="italic">ψ<tspan baseline-shift="sub" font-size="12">inter</tspan></text>
  </g>

  <g id="gspe" transform="translate(250 690)">
    <rect x="0" y="0" width="920" height="220" class="outer"/>
    <text x="460" y="30" text-anchor="middle" class="txt label">Global Semantic Prior Encoder (GSPE)</text>
    <rect x="30" y="55" width="410" height="140" class="panel"/><rect x="480" y="55" width="410" height="140" class="panel"/>
    <text x="235" y="82" text-anchor="middle" class="txt small">Pocket Semantic Injection (ESM)</text><rect x="70" y="110" width="135" height="36" class="sub"/><text x="138" y="135" text-anchor="middle" class="txt label">ESM-2</text><rect x="270" y="92" width="140" height="88" rx="25" class="sub"/><text x="288" y="116" class="txt tiny">Align:</text><text x="340" y="135" text-anchor="middle" class="txt tiny">structure ↔ sequence</text><text x="288" y="158" class="txt tiny">Project / Fuse</text>
    <text x="685" y="82" text-anchor="middle" class="txt small">Ligand Semantic Injection (Mol2Vec)</text><circle cx="575" cy="130" r="7" class="atomB"/><circle cx="595" cy="150" r="7" fill="#ffd966" stroke="#153d73" stroke-width="2"/><circle cx="617" cy="130" r="7" fill="#f4b183" stroke="#153d73" stroke-width="2"/><rect x="700" y="108" width="96" height="16" fill="#9bb9e5"/><rect x="700" y="138" width="96" height="16" fill="#ffd966"/><rect x="700" y="168" width="96" height="16" fill="#f4b183"/>
  </g>

  <g id="fusion" transform="translate(1245 420)">
    <rect x="0" y="0" width="28" height="96" class="bluebar"/><path d="M28 48 H95 V265" class="arrow"/>
    <rect x="0" y="210" width="28" height="96" class="bluebar"/><path d="M28 258 H95 V265" class="arrow"/>
    <rect x="0" y="405" width="28" height="96" class="bluebar"/><path d="M28 453 H95 V265" class="arrow"/>
    <circle cx="118" cy="265" r="31" fill="#dbe4f3" stroke="#153d73" stroke-width="3"/><circle cx="118" cy="265" r="16" fill="#ffff00" stroke="#153d73" stroke-width="2"/><path d="M102 265 H134M118 249 V281" stroke="#153d73" stroke-width="3"/>
    <path d="M149 265 H205" class="arrow"/>
    <polygon points="225,130 360,190 360,340 225,390" fill="#dbe4f3" stroke="#153d73" stroke-width="2"/>
    <text x="292" y="245" text-anchor="middle" class="txt label">MLP</text><text x="292" y="285" text-anchor="middle" class="txt label">Predictor</text>
